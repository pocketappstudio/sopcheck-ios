# Same path as Buck Ledger / Hubs: GitHub-hosted macOS runner + fastlane + App Store Connect API key (repo secrets).
# Manual only. The TestFlight job must not be run until Slade approves the screens and the App Store Connect record exists.
name: iOS
on:
  workflow_dispatch:
    inputs:
      signed: { description: "Signed .ipa artifact (no upload)", type: boolean, default: true }
      testflight: { description: "Archive and upload to TestFlight (only after Slade approves and the ASC record exists)", type: boolean, default: false }
jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npx cap sync ios      # www/ is committed by the build script before pushing (needs the Python backend bundle)
      - run: xcodebuild -workspace ios/App/App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tail -n 40
  testflight:
    if: inputs.testflight
    needs: simulator-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npx cap sync ios
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - run: bundle exec fastlane beta
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
  signed-ipa:
    if: inputs.signed && !inputs.testflight
    needs: simulator-build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci && npx cap sync ios
      - uses: ruby/setup-ruby@v1
        with: { ruby-version: '3.3', bundler-cache: true }
      - run: bundle exec fastlane signed_build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: SOPCheck-ipa, path: build/SOPCheck.ipa, retention-days: 14 }
